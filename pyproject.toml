[project]
name = "scadia"
version = "0.1.0"
description = "Drive OpenSCAD with Claude — natural-language CAD with a vision-feedback iteration loop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
scadia = "scadia.cli:main"
badgeforge = "badgeforge.cli:main"
stepforge = "stepforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
step = [
    "build123d>=0.10",
    # Pinned exactly: OCCT's STL writer's float formatting drifts across
    # minor versions, which would churn the auto-committed step-demo/*.stl
    # in CI on every wheel update.
    "cadquery-ocp==7.8.1.1.post1",
    "trimesh>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scadia", "src/badgeforge", "src/stepforge"]
