[project]
name = "scadia"
version = "0.1.0"
description = "Drive OpenSCAD with Claude — natural-language CAD with a vision-feedback iteration loop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
scadia = "scadia.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scadia"]
