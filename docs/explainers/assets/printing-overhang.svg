<text x="32" y="298" font-size="9" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace" fill="#6b7280" font-style="italic">FDM printers can self-support overhangs up to ~45°. A flat radial jump fails; a 45° conical chamfer succeeds.</text>
