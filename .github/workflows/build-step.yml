name: Build STEP Models

on:
  push:
    branches: [main]
    paths:
      - 'step-demo/**.step'
      - 'step-demo/parts/**'
      - 'src/cardlab/**'
      - 'pyproject.toml'
      - '.github/workflows/build-step.yml'
  pull_request:
    paths:
      - 'step-demo/**.step'
      - 'step-demo/parts/**'
      - 'src/cardlab/**'
      - 'pyproject.toml'
      - '.github/workflows/build-step.yml'

# Cancel any in-flight run for the same branch when a new push arrives.
# Prevents two auto-commits from racing each other (and the human pusher).
concurrency:
  group: build-step-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-step:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install OpenSCAD + xvfb (PNG rendering needs an X display)
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies (with the heavy OCP wheel)
        run: uv sync --extra step

      - name: Inspect pounce-a-pult.step
        run: |
          mkdir -p docs/pounce-a-pult
          uv run cardlab inspect step-demo/pounce-a-pult.step \
            | tee docs/pounce-a-pult/inspect.txt

      - name: Tessellate STEP -> STL (renders in GitHub's native viewer)
        run: uv run cardlab build
              --in step-demo/pounce-a-pult.step
              --out step-demo/pounce-a-pult.stl

      - name: Tessellate STEP -> GLB (for embeds and downstream viewers)
        run: uv run cardlab build
              --in step-demo/pounce-a-pult.step
              --out step-demo/pounce-a-pult.glb

      - name: Render orthographic PNGs (iso / top / edge)
        run: |
          mkdir -p docs/pounce-a-pult/assets
          for angle in iso top edge; do
            xvfb-run -a uv run cardlab render \
              --in step-demo/pounce-a-pult.step \
              --angle "$angle" \
              --out "docs/pounce-a-pult/assets/${angle}.png"
          done

      - name: Decompose into parts + exploded view + GIF
        run: xvfb-run -a uv run cardlab explode
              --in step-demo/pounce-a-pult.step
              --out docs/pounce-a-pult/assets/
              --strategy cat-toy
              --angle low-iso
              --factor 1.0
              --frames 24

      - name: Generate example assembly parts (idempotent)
        run: uv run python step-demo/parts/generate.py

      - name: Compose multi-part assembly
        run: uv run cardlab assemble
              --manifest step-demo/parts/assembly.toml
              --out step-demo/parts/assembled.step
              --also-stl

      - name: Verify outputs
        run: |
          ls -la step-demo/ step-demo/parts/ docs/pounce-a-pult/ docs/pounce-a-pult/assets/
          file step-demo/*.stl step-demo/*.glb step-demo/parts/*.stl
          file docs/pounce-a-pult/assets/*.png docs/pounce-a-pult/assets/exploded.gif
          test -f docs/pounce-a-pult/assets/manifest.toml
          test -f docs/pounce-a-pult/inspect.txt

      - name: Upload STEP/STL/GLB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: step-models
          path: |
            step-demo/*.stl
            step-demo/*.glb
            step-demo/parts/*.step
            step-demo/parts/*.stl
          retention-days: 30

      - name: Upload renders + tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: step-renders
          path: |
            docs/pounce-a-pult/inspect.txt
            docs/pounce-a-pult/assets/**
            !docs/pounce-a-pult/assets/_frames/**
          retention-days: 30

      - name: Commit regenerated artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add \
            step-demo/pounce-a-pult.stl \
            step-demo/pounce-a-pult.glb \
            step-demo/parts/*.step \
            step-demo/parts/*.stl \
            docs/pounce-a-pult/inspect.txt \
            docs/pounce-a-pult/assets/iso.png \
            docs/pounce-a-pult/assets/top.png \
            docs/pounce-a-pult/assets/edge.png \
            docs/pounce-a-pult/assets/exploded.gif \
            docs/pounce-a-pult/assets/exploded.glb \
            docs/pounce-a-pult/assets/pounce-a-pult.glb \
            docs/pounce-a-pult/assets/manifest.toml \
            docs/pounce-a-pult/assets/parts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate STEP-derived artifacts via cardlab

          Generated with GitHub Actions"
            # Push with rebase-and-retry — peer auto-commit workflows
            # (build-stl, build-card, build-explainers) sometimes race us
            # to main. Each workflow writes to disjoint paths, so rebasing
            # onto the winner is always conflict-free.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt"
                break
              fi
              echo "Push rejected (attempt $attempt); rebasing onto origin/main..."
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
            done
          fi
