name: Build Card Renders

on:
  push:
    branches: [main]
    paths:
      - 'jmcpheron-card.step'
      - 'jmcpheron-card.meta.toml'
      - 'src/cardlab/**'
      # spin.gif parameters live in src/explainers/card.py — touch it,
      # the spinning chain re-renders here (alongside explainer pages
      # in the parallel build-explainers workflow).
      - 'src/explainers/card.py'
      - 'pyproject.toml'
      - '.github/workflows/build-card.yml'
  pull_request:
    paths:
      - 'jmcpheron-card.step'
      - 'jmcpheron-card.meta.toml'
      - 'src/cardlab/**'
      - 'src/explainers/card.py'
      - 'pyproject.toml'
      - '.github/workflows/build-card.yml'

# Cancel any in-flight run for the same branch when a new push arrives.
# Prevents two auto-commits from racing each other (and the human pusher).
concurrency:
  group: build-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install OpenSCAD + xvfb (PNG rendering needs an X display)
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies (step extra pulls cascadio + trimesh)
        run: uv sync --extra step

      - name: Inspect jmcpheron-card.step
        run: |
          mkdir -p docs/assets/card
          uv run cardlab inspect jmcpheron-card.step \
            | tee docs/assets/card/inspect.txt

      - name: Tessellate STEP -> STL (GitHub viewer)
        run: uv run cardlab build
              --in jmcpheron-card.step
              --out docs/assets/card/jmcpheron-card.stl

      - name: Decompose into parts + exploded view + GIF
        run: xvfb-run -a uv run cardlab explode
              --in jmcpheron-card.step
              --out docs/assets/card/
              --strategy card-layered
              --factor 1.0
              --frames 24

      - name: Render running-chain GIF (parametric, build123d + bd_warehouse)
        run: xvfb-run -a uv run cardlab spin
              --out docs/assets/card/
              --frames 60
              --input-turns 4.0

      - name: Verify outputs
        run: |
          ls -la docs/assets/card/ docs/assets/card/parts/
          file docs/assets/card/*.glb docs/assets/card/*.gif
          file docs/assets/card/*.stl docs/assets/card/parts/*.png
          test -f docs/assets/card/spin.gif

      - name: Upload card artifacts
        uses: actions/upload-artifact@v4
        with:
          name: card-renders
          path: |
            docs/assets/card/**
            !docs/assets/card/_frames/**
          retention-days: 30

      - name: Commit regenerated artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Stage everything under docs/assets/card/ except the debug frames.
          git add docs/assets/card/jmcpheron-card.glb \
                  docs/assets/card/jmcpheron-card.stl \
                  docs/assets/card/exploded.glb \
                  docs/assets/card/exploded.gif \
                  docs/assets/card/spin.gif \
                  docs/assets/card/manifest.toml \
                  docs/assets/card/inspect.txt \
                  docs/assets/card/parts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate card-derived artifacts via cardlab

          Generated with GitHub Actions"
            # Push with rebase-and-retry — peer auto-commit workflows
            # (build-stl, build-step, build-explainers) sometimes race us
            # to main. Each workflow writes to disjoint paths, so rebasing
            # onto the winner is always conflict-free.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt"
                break
              fi
              echo "Push rejected (attempt $attempt); rebasing onto origin/main..."
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
            done
          fi
