name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is excluded: cadquery-ocp==7.8.1.1.post1 (pinned to avoid
        # OCCT STL float-format drift) depends on vtk==9.3.1, which has no
        # cp313 wheels. Revisit when we can bump cadquery-ocp.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --all-extras

      - name: Run pytest under xvfb
        run: xvfb-run -a uv run pytest -v
