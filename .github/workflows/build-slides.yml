name: Build Slides

on:
  push:
    paths:
      - 'docs/slides/*.md'
      - '.github/workflows/build-slides.yml'
  pull_request:
    paths:
      - 'docs/slides/*.md'
      - '.github/workflows/build-slides.yml'

# Cancel any in-flight run for the same branch when a new push arrives.
concurrency:
  group: build-slides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-slides:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install marp-cli
        run: npm install -g @marp-team/marp-cli

      - name: Install Google Chrome (for PDF rendering)
        uses: browser-actions/setup-chrome@v1

      - name: Build HTML, PDF, and PPTX
        run: |
          cd docs/slides
          for md in *.md; do
            base="${md%.md}"
            echo "Building $md..."
            # HTML — animated SVGs work in browser; --html allows inline tags
            marp "$md" --html -o "${base}.html"
            # PDF — uses Chrome via puppeteer
            marp "$md" --pdf --allow-local-files -o "${base}.pdf"
            # PPTX — open format, importable into Google Slides / LibreOffice / Keynote
            marp "$md" --pptx --allow-local-files -o "${base}.pptx"
          done

      - name: Upload slide artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: |
            docs/slides/*.html
            docs/slides/*.pdf
            docs/slides/*.pptx
          retention-days: 90

      - name: Commit built slides
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/slides/*.html docs/slides/*.pdf docs/slides/*.pptx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build slides from docs/slides/*.md

          Generated HTML, PDF, and PPTX with GitHub Actions"
            # Push with rebase-and-retry — other auto-commit workflows may
            # race on the same branch. Each writes to disjoint paths so
            # rebasing onto the winner is always conflict-free.
            branch="${{ github.ref_name }}"
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt"
                break
              fi
              echo "Push rejected (attempt $attempt); rebasing onto origin/$branch..."
              git fetch origin "$branch"
              git rebase "origin/$branch" || { git rebase --abort; exit 1; }
            done
          fi
